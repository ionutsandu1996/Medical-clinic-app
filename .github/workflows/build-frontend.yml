name: Build & Push Frontend

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    
    outputs:
      image_name: ${{ steps.image.outputs.name }}
      image_version: ${{ steps.version.outputs.current }}
      image_tags: ${{ steps.meta.outputs.tags }}


    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image name lowercase
        id: image
        run: |
          echo "name=$(echo ${{ env.REGISTRY }}/${{ github.repository }}/clinic-frontend | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calculate next version
        id: version
        run: |
          CURRENT="${{ vars.FRONTEND_VERSION }}"
          MAJOR=$(echo $CURRENT | cut -d. -f1)
          MINOR=$(echo $CURRENT | cut -d. -f2)
          PATCH=$(echo $CURRENT | cut -d. -f3)
          NEXT_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
          echo "current=$CURRENT" >> $GITHUB_OUTPUT
          echo "next=$NEXT_VERSION" >> $GITHUB_OUTPUT
          echo "Frontend: $CURRENT → $NEXT_VERSION"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=v${{ steps.version.outputs.current }}
            type=sha,prefix=,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          target: production
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ steps.image.outputs.name }}:buildcache
          cache-to: type=registry,ref=${{ steps.image.outputs.name }}:buildcache,mode=max
          build-args: |
            VITE_API_URL=/api

      - name: Increment version
        run: |
          curl -L \
            -X PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GHCR_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/variables/FRONTEND_VERSION \
            -d "{\"name\":\"FRONTEND_VERSION\",\"value\":\"${{ steps.version.outputs.next }}\"}"

      - name: Print image details
        run: |
          echo "✅ Frontend build reusit!"
          echo "📦 Versiune: v${{ steps.version.outputs.current }}"
          echo "🔍 docker pull ${{ steps.image.outputs.name }}:v${{ steps.version.outputs.current }}"

  summary:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Generate Build Summary
        run: |
          echo "## 🐳 Docker Build Report — Backend" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Image** | \`${{ needs.build-and-push.outputs.image_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Version** | \`v${{ needs.build-and-push.outputs.image_version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Tags** | \`${{ needs.build-and-push.outputs.image_tags }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Triggered by** | @${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Timestamp** | \`$(date -u '+%Y-%m-%d %H:%M:%S UTC')\` |" >> $GITHUB_STEP_SUMMARY