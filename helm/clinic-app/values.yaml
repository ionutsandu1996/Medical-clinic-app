name: clinic-app
namespace: clinic

backend:
  image:
    repository: ghcr.io/ionutsandu1996/medical-clinic-app/clinic-backend
    tag: "latest"
    pullPolicy: Always
  replicaCount: 1

frontend:
  image:
    repository: ghcr.io/ionutsandu1996/medical-clinic-app/clinic-frontend
    tag: "latest"
    pullPolicy: Always
  replicaCount: 1

ports:
  backend: 3001
  frontend: 80

ingress:
  enabled: true
  host: clinic.local

config:
  data:
    NODE_ENV: "production"
    PORT: "3001"
    DB_HOST: "clinic-app-postgresql"
    DB_PORT: "5432"
    DB_NAME: "clinic_db"
    DB_USER: "clinic_user"
    DB_POOL_MIN: "2"
    DB_POOL_MAX: "10"
    CORS_ORIGIN: "http://clinic.local"

secret:
  DB_PASSWORD: "changeit"
  POSTGRES_PASSWORD: "changeit"

postgresql:
  enabled: true
  image:
    tag: latest
  auth:
    database: "clinic_db"
    username: "clinic_user"
    password: "changeit"
    postgresPassword: "changeit"
  primary:
    persistence:
      enabled: true
      size: 1Gi