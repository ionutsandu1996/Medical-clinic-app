server {
    listen 80;
    server_name localhost;

    # Folderul unde sunt fisierele statice React
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression - reduce dimensiunea fisierelor transmise
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # SPA Fallback - CRITIC pentru React Router
    # Fara asta, /doctors da 404 la refresh
    # Cu asta, orice ruta e servita din index.html
    # si React Router gestioneaza navigarea
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache pentru assets statice (JS, CSS, imagini)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy catre backend pentru request-urile API
    # /api/* -> backend:4000
    location /api/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}